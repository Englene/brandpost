key = "vaktrom"
name = "Vaktrom"
handle = "vaktrom"
enabled = true
wordmark = "vaktrom"          # ingen logo: kortene er typografi-drevne
language = "no"

[linkedin]
# Tom = ingen publisering, kun generering. Fylles ut når firmasida er verifisert.
org_urn = ""
handle = ""

# Palett for et sikkerhetsprodukt som IKKE skal skremme.
# Begrunnelsen står i merkevare/designstil.md: petroleum i stedet for alarmrødt,
# lys bakgrunn i stedet for svart «overvåkings»-look.
[palette]
bg = "#F2F4F3"                # kjølig lys grå, som en arbeidstegning
ink = "#3D4A4F"               # brødtekst, skifergrå
headline = "#15242A"          # nesten svart med blågrått i, høy kontrast mot bg
brand = "#1F5F66"             # petroleum. Fyller de store formene: «på vakt», ikke «alarm»
shape = "#D5E0DF"             # blek stålgrønn, kun svake støtteflater
dark = "#15242A"              # mørkt panel
accent = "#E08A1E"            # dempet varselgul. Sparsom, aldri store flater

[fonts]
display = "Fraunces.ttf"
body = "Inter.ttf"

# Ingen [media]-seksjon: ingen logo levert. Motoren degraderer til typografi-kort.

[[pillar]]
id = "kost-mot-tap"
label = "Hva det koster"
desc = "Prisen på overvåking satt opp mot regninga for ett innbrudd: utstyr, stillstand og forsikringsegenandel."

[[pillar]]
id = "uten-vaktselskap"
label = "Uten vaktselskap"
desc = "Hvem som faktisk får varselet klokka to om natta, og hva som skjer videre uten en vaktkontrakt."

[[pillar]]
id = "natta-pa-bygget"
label = "Natta på bygget"
desc = "Hva som skjer på en byggeplass mellom 22 og 05, beskrevet nøkternt og uten dramatikk."

[[pillar]]
id = "oppsett-og-drift"
label = "Oppsett og drift"
desc = "Strøm, dekning og flytting av kamera når bygget vokser. Hva byggelederen må gjøre selv."

[[pillar]]
id = "regler-og-personvern"
label = "Regler og personvern"
desc = "Hva som er lov å filme på en arbeidsplass, hva som krever skilting og avtale, og hvem som kan se opptaket."
